name: Compilar APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      # El SDK de Android ya viene en el runner. Solo se regenera la carpeta android/
      # con la plantilla oficial de ESTA versión de Flutter, para evitar desajustes
      # de Gradle / AGP / Kotlin escritos a mano.
      - name: Generar plantilla Android
        run: |
          flutter create --platforms=android --org co.obra --project-name control_concreto --no-pub /tmp/scaffold
          rm -rf android
          cp -r /tmp/scaffold/android android
          sed -i 's/android:label="[^"]*"/android:label="Control Túnel 0"/' android/app/src/main/AndroidManifest.xml

      - run: flutter pub get

      - name: Compilar APK release
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: ControlConcreto-APK
          path: build/app/outputs/flutter-apk/app-release.apk
